# Flatpak, driven as a command.
#
# Flatpak introduced JSON output for query commands in version 1.17.0
# (flatpak#6337), so records are read with field maps rather than line
# patterns.
#
# Verified against flatpak 1.18.4 on Linux.
schema_version = 1
id = "flatpak"
name = "Flatpak"
version = "1"
description = "Sandboxed desktop applications via Flatpak"

# Most specific selector first: Flatpak identifies applications by reverse-DNS ID.
selector = ["{application_id}"]

# Flatpak escalates itself through its Polkit system helper for system-wide
# operations. Running under sudo or pkexec bypasses the helper and fails on
# SELinux and permissions, so elevate is false for both scopes.
[system]
args = ["--system"]
elevate = false

[detect]
command = "flatpak"
version = ["--version"]
min_version = "1.17"

[ops.search]
args = ["search", "-j", "{query}"]
output = { format = "json" }
fields = { name = "name", application_id = "application_id", description = "description", version = "version", repo = "remotes" }

[ops.list_installed]
args = ["list", "--columns=all", "--app", "-j"]
output = { format = "json" }
fields = { name = "name", application_id = "application_id", description = "description", version = "version", repo = "origin", size = "installed_size" }

# remote-ls --updates reports only the available remote target version.
# The currently installed version is not reported in this output stream,
# so the UI shows the available target version.
[ops.list_updates]
args = ["remote-ls", "--updates", "--app", "-j"]
output = { format = "json" }
fields = { name = "name", application_id = "application_id", version = "version", new_version = "version", repo = "origin" }

# --noninteractive implies --assumeyes.
[ops.install]
args = ["install", "--noninteractive", "{selector}"]
output = { format = "lines" }

[ops.remove]
args = ["uninstall", "--noninteractive", "{selector}"]
output = { format = "lines" }

[ops.update]
args = ["update", "--noninteractive", "{selector}"]
output = { format = "lines" }

[ops.update_all]
args = ["update", "--noninteractive"]
output = { format = "lines" }

[ops.list_repos]
args = ["remotes", "-d", "-j"]
output = { format = "json" }
fields = { name = "name", url = "url", description = "description" }

[ops.add_repo]
args = ["remote-add", "--if-not-exists", "{name}", "{url}"]
output = { format = "lines" }

[ops.remove_repo]
args = ["remote-delete", "--force", "{name}"]
output = { format = "lines" }
